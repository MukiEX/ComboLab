server {
    listen 443 ssl;
    http2 on;
    server_name combolab.example.com;
    ssl_certificate     /etc/letsencrypt/live/combolab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/combolab.example.com/privkey.pem;

    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
